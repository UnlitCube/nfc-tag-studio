<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP: everything local. No remote scripts, no inline scripts, no frames.
         External links go through main (shell.openExternal). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFC Tag Studio</title>
    <!-- Applies the saved theme before first paint (no white/dark flash). -->
    <script src="./theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
