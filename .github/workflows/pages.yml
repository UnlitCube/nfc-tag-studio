# GitHub Pages のサイト（tools/build-site.mjs が site/ と docs/images から site-dist/ に作る）を公開する。
#
# 走るのは 3 つのとき:
#   - master にサイトの元（site/・画像・生成スクリプト・版）が入ったとき
#   - release.yml が Release を作ったあと（gh workflow run pages.yml --ref master で起動される）
#   - 手動
#
# **リポジトリが Private の間は何もしない**（Org は Free プランで、Private では Pages を使えない）。
# Public にしたあと、Settings → Pages → Source を「GitHub Actions」にしてから、手動で 1 回流す（docs/RELEASING.md）。
#
# npm ci をしない。生成スクリプトは Node の標準ライブラリだけで動く（Electron を毎回落とさずに済む）。

name: pages

on:
  push:
    branches: [master]
    paths:
      - site/**
      - docs/images/**
      - tools/build-site.mjs
      - package.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

# 公開は 1 本ずつ。走っている公開は止めない（途中で切ると半端なサイトが残りうる）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: サイトを作る
        run: node tools/build-site.mjs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
